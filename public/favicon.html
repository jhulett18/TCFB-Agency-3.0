<!DOCTYPE html>
<html>
<head>
    <title>Favicon Generator</title>
</head>
<body>
    <h1>Favicon Generator</h1>
    <p>To create a favicon.ico file:</p>
    <ol>
        <li>Use an online favicon generator like <a href="https://favicon.io/" target="_blank">favicon.io</a></li>
        <li>Upload the tcfb_logo.png file from the assets folder</li>
        <li>Download the generated favicon.ico</li>
        <li>Place it in the public folder as favicon.ico</li>
    </ol>
    <p>Or you can use the existing logo:</p>
    <img src="assets/tcfb_logo.png" alt="TCFB Logo" style="width: 32px; height: 32px;">
</body>
</html>
